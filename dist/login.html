<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CallCatch login preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--ink:#1a1a1a;--ink-soft:#4a4a4a;--accent:#d94f1e;--display:'Fraunces',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,monospace}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:var(--display);color:var(--ink)}.wrap{max-width:980px;margin:0 auto;padding:0 28px}nav{padding:26px 0;border-bottom:1px solid var(--ink);display:flex;justify-content:space-between}.logo{font-weight:900;font-size:22px;text-decoration:none;color:var(--ink)}.logo span{color:var(--accent)}.nav-link,.btn{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.12em;text-decoration:none}.nav-link{color:var(--ink-soft)}main{padding:80px 0;display:grid;grid-template-columns:1fr 420px;gap:60px}.eyebrow{font-family:var(--mono);font-size:13px;text-transform:uppercase;letter-spacing:.15em;color:var(--accent);margin-bottom:22px}h1{font-size:clamp(42px,7vw,72px);line-height:.98;letter-spacing:-.035em;margin:0 0 22px;font-weight:900}em{color:var(--accent);font-style:italic;font-weight:500}p{font-size:18px;line-height:1.55;color:var(--ink-soft)}.card{background:#fff;border:2px solid var(--ink);padding:34px;box-shadow:8px 8px 0 var(--ink)}label{display:block;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft);margin:0 0 8px}input{width:100%;padding:13px 14px;border:1.5px solid var(--ink);margin-bottom:16px}.btn{display:block;text-align:center;width:100%;padding:16px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}.notice{padding:13px 15px;border:1.5px solid var(--accent);background:#fdecdb;color:var(--accent);font-family:var(--mono);font-size:12px;line-height:1.5;margin-bottom:18px}@media(max-width:850px){main{grid-template-columns:1fr}.card{box-shadow:4px 4px 0 var(--ink)}} 
</style>
</head>
<body>
<div class="wrap">
  <nav><a class="logo" href="/">Call<span>Catch</span>.</a><a class="nav-link" href="/signup.html">Start trial</a></nav>
  <main>
    <section><div class="eyebrow">Login preview</div><h1>Your SaaS login <em>screen</em>.</h1><p>This page is ready visually. Real login will be switched on when Supabase is connected.</p></section>
    <section class="card">
      <div class="notice">Preview mode: no backend connected yet.</div>
      <label>Email</label><input type="email" placeholder="you@example.com">
      <label>Password</label><input type="password" placeholder="••••••••">
      <a class="btn" href="/dashboard.html">View dashboard preview</a>
    </section>
  </main>
</div>
</body>
</html>
