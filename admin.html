<!DOCTYPE html><html lang="en-GB"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>CallCatch admin dashboard</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><style>:root{--bg:#f4f1ea;--ink:#1a1a1a;--ink-soft:#4a4a4a;--accent:#d94f1e;--display:'Fraunces',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,monospace}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:var(--display);color:var(--ink)}.wrap{max-width:1160px;margin:0 auto;padding:0 28px}nav{padding:26px 0;border-bottom:1px solid var(--ink);display:flex;justify-content:space-between}.logo{font-weight:900;font-size:22px;text-decoration:none;color:var(--ink)}.logo span{color:var(--accent)}.nav-link{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.12em;text-decoration:none;color:var(--ink-soft)}main{padding:64px 0}.eyebrow{font-family:var(--mono);font-size:13px;text-transform:uppercase;letter-spacing:.15em;color:var(--accent);margin-bottom:18px}h1{font-size:clamp(40px,6vw,70px);line-height:.98;letter-spacing:-.035em;margin:0 0 18px;font-weight:900}em{color:var(--accent);font-style:italic;font-weight:500}p{font-size:18px;line-height:1.55;color:var(--ink-soft)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin:34px 0}.card{background:#fff;border:2px solid var(--ink);padding:26px;box-shadow:6px 6px 0 var(--ink)}.label,th,td{font-family:var(--mono);font-size:12px}.label{text-transform:uppercase;letter-spacing:.12em;color:var(--ink-soft)}.value{display:block;font-size:34px;font-weight:900;letter-spacing:-.03em;margin-top:8px}table{width:100%;border-collapse:collapse;background:#fff;border:2px solid var(--ink)}th,td{text-align:left;padding:15px;border-bottom:1px solid rgba(0,0,0,.16)}th{text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft)}.notice{display:none;border:1.5px solid var(--accent);background:#fdecdb;color:var(--accent);padding:14px 16px;font-family:var(--mono);font-size:12px;line-height:1.5;margin:22px 0}.notice.error{border-color:#9f1d1d;background:#fff1f1;color:#9f1d1d}@media(max-width:850px){.stats{grid-template-columns:1fr}.card{box-shadow:4px 4px 0 var(--ink)}table{font-size:11px}}</style></head><body><div class="wrap"><nav><a class="logo" href="/">Call<span>Catch</span>.</a><a class="nav-link" href="/dashboard.html">Customer dashboard</a></nav><main><div class="eyebrow">Admin dashboard</div><h1>Manage customers and <em>trials</em>.</h1><p>Admin access is controlled in Supabase using the admin_users table.</p><div class="notice" id="message"></div><section class="stats"><div class="card"><span class="label">Customers</span><strong class="value" id="customerCount">0</strong></div><div class="card"><span class="label">Trial price</span><strong class="value">£45</strong></div><div class="card"><span class="label">Trial length</span><strong class="value">21 days</strong></div></section><table><thead><tr><th>Customer</th><th>Business</th><th>Mobile</th><th>Status</th></tr></thead><tbody id="rows"><tr><td colspan="4">Loading...</td></tr></tbody></table></main></div><script type="module">import{getConfig,hasSupabase,requireUser,showMessage}from'./app.js';const config=await getConfig();if(!hasSupabase(config)){showMessage('message','Setup needed: add free Supabase keys in Cloudflare before admin works.',true);document.getElementById('rows').innerHTML='<tr><td colspan="4">Supabase not connected.</td></tr>'}else{const{user,supabase}=await requireUser();if(user){try{const{data:isAdmin,error:adminError}=await supabase.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(adminError)throw adminError;if(!isAdmin){showMessage('message','You are logged in, but not marked as an admin. Add your user_id to admin_users in Supabase.',true);document.getElementById('rows').innerHTML='<tr><td colspan="4">Not an admin.</td></tr>'}else{const{data,error}=await supabase.from('customers').select('*').order('created_at',{ascending:false});if(error)throw error;document.getElementById('customerCount').textContent=data.length;document.getElementById('rows').innerHTML=data.map(c=>'<tr><td>'+(c.first_name||'')+' '+(c.last_name||'')+'<br>'+c.email+'</td><td>'+(c.business_name||'-')+'</td><td>'+(c.mobile||'-')+'</td><td>'+(c.onboarding_status||'signup')+'</td></tr>').join('')||'<tr><td colspan="4">No customers yet.</td></tr>'}}catch(error){showMessage('message',error.message,true);document.getElementById('rows').innerHTML='<tr><td colspan="4">Could not load customers.</td></tr>'}}}</script></body></html>
